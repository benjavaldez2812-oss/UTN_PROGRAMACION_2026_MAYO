<!DOCTYPE html><!-- Tipo de documento HTML  -->
<html lang="es"><!-- MARCA EL INICIO DEL HTML Y TIENE EL ATRIBUTO lang que determina el lenguaje en el que esta escrito la pagina,

<head><!-- configuracion de la pagina, generalmente cosas para el navegador -->
