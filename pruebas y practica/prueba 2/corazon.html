<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #060208;
    overflow: hidden;
    cursor: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, CX, CY, SCALE;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  CX = W / 2;
  CY = H / 2 - H * 0.07; // Subir el corazón ligeramente para evitar que la punta inferior se corte
  SCALE = Math.min(W, H) / 520 * 16; // Ajuste para que el corazón sea más pequeño y se vea completo
  buildPath();
}

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: x * SCALE, y: y * SCALE };
}

const NUM_STEPS = 6000;
let heartPath = [], dists = [], pathLength = 0, chars = [];
const FONT_SIZE_BASE = () => Math.min(W, H) * 0.034;
const UNIT = 'I love you ';

function buildPath() {
  heartPath = []; dists = [0]; pathLength = 0;
  for (let i = 0; i < NUM_STEPS; i++) {
    const t = (i / NUM_STEPS) * Math.PI * 2;
    heartPath.push(heartPoint(t));
    if (i > 0) {
      const a = heartPath[i-1], b = heartPath[i];
      pathLength += Math.sqrt((b.x-a.x)**2 + (b.y-a.y)**2);
    }
    dists.push(pathLength);
  }
  const fs = FONT_SIZE_BASE();
  ctx.font = `bold ${fs}px Georgia, serif`;
  const unitW = ctx.measureText(UNIT).width;
  const copies = Math.floor(pathLength / unitW);
  const scale = (pathLength / copies) / unitW;
  chars = [];
  let pos = 0;
  const base = UNIT.repeat(copies + 1);
  for (let i = 0; i < base.length; i++) {
    const ch = base[i];
    const w = ctx.measureText(ch).width * scale;
    if (pos >= pathLength) break;
    chars.push({ ch, d: pos });
    pos += w;
  }
}

function getPt(d) {
  d = ((d % pathLength) + pathLength) % pathLength;
  let lo = 0, hi = NUM_STEPS - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    dists[mid] <= d ? lo = mid : hi = mid;
  }
  const frac = (dists[lo+1] - dists[lo]) === 0 ? 0 : (d - dists[lo]) / (dists[lo+1] - dists[lo]);
  const p0 = heartPath[lo], p1 = heartPath[(lo+1) % NUM_STEPS];
  return {
    x: p0.x + (p1.x - p0.x) * frac,
    y: p0.y + (p1.y - p0.y) * frac,
    angle: Math.atan2(p1.y - p0.y, p1.x - p0.x)
  };
}

// Particles
const particles = [];
function initParticles() {
  particles.length = 0;
  for (let i = 0; i < 90; i++) {
    particles.push({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.8 + 0.3,
      alpha: Math.random() * 0.35 + 0.08,
      speed: Math.random() * 0.35 + 0.06,
      drift: (Math.random() - 0.5) * 0.25,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

// Sparkles on heart
const sparkles = [];
function initSparkles() {
  sparkles.length = 0;
  for (let i = 0; i < 24; i++) {
    const t = (i / 24) * Math.PI * 2;
    sparkles.push({
      t,
      orbitR: 18 + Math.random() * 12,
      orbitOffset: Math.random() * Math.PI * 2,
      orbitSpeed: Math.random() * 0.02 + 0.008,
      r: Math.random() * 3 + 1.2,
      alpha: Math.random() * 0.5 + 0.3,
      twinklePhase: Math.random() * Math.PI * 2,
      hue: Math.random() * 30 + 340,
    });
  }
}

// Mouse hearts
const miniHearts = [];
let mouse = { x: -999, y: -999 };
let lastSpawn = 0;

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  const now = Date.now();
  if (now - lastSpawn > 50) {
    lastSpawn = now;
    miniHearts.push({
      x: mouse.x + (Math.random() - 0.5) * 12,
      y: mouse.y + (Math.random() - 0.5) * 12,
      size: Math.random() * 9 + 6,
      vy: -(Math.random() * 0.8 + 0.3),
      vx: (Math.random() - 0.5) * 0.6,
      life: 1.0,
      decay: Math.random() * 0.011 + 0.006,
      hue: Math.random() * 30 + 340,
    });
  }
});

function drawMiniHeart(x, y, size, alpha, hue) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = `hsl(${hue},85%,62%)`;
  const s = size * 0.5;
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.5);
  ctx.bezierCurveTo(x, y - s*0.3, x - s, y - s*0.3, x - s, y + s*0.2);
  ctx.bezierCurveTo(x - s, y + s*0.8, x, y + s*1.3, x, y + s*1.3);
  ctx.bezierCurveTo(x, y + s*1.3, x + s, y + s*0.8, x + s, y + s*0.2);
  ctx.bezierCurveTo(x + s, y - s*0.3, x, y - s*0.3, x, y + s*0.5);
  ctx.fill();
  ctx.restore();
}

function drawHeartOutline(alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = 'rgba(200,30,60,1)';
  ctx.lineWidth = 0.6;
  ctx.beginPath();
  for (let i = 0; i <= NUM_STEPS; i++) {
    const pt = heartPath[i % NUM_STEPS];
    i === 0 ? ctx.moveTo(CX + pt.x, CY + pt.y) : ctx.lineTo(CX + pt.x, CY + pt.y);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

let offset = 0;
const startTime = Date.now();

function draw() {
  const t = (Date.now() - startTime) / 1000;
  ctx.clearRect(0, 0, W, H);

  // Deep background
  const bg = ctx.createRadialGradient(CX, CY, 0, CX, CY, Math.max(W, H) * 0.75);
  bg.addColorStop(0, 'rgba(35,4,14,1)');
  bg.addColorStop(1, 'rgba(6,2,8,1)');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Floating dust
  for (const p of particles) {
    p.y -= p.speed;
    p.x += Math.sin(t * 0.4 + p.phase) * p.drift;
    if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
    ctx.save();
    ctx.globalAlpha = p.alpha * (0.5 + 0.5 * Math.sin(t * 1.1 + p.phase));
    ctx.fillStyle = 'rgb(230,70,100)';
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Pulsing heart glow
  const pulse = 1 + 0.055 * Math.sin(t * 2.1);
  ctx.save();
  ctx.translate(CX, CY); ctx.scale(pulse, pulse); ctx.translate(-CX, -CY);
  const g1 = ctx.createRadialGradient(CX, CY+10, 30, CX, CY+10, SCALE * 16);
  g1.addColorStop(0, 'rgba(200,20,50,0.28)');
  g1.addColorStop(0.4, 'rgba(150,10,35,0.12)');
  g1.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g1;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // Second outer glow ring
  const g2 = ctx.createRadialGradient(CX, CY, SCALE*8, CX, CY, SCALE*18);
  g2.addColorStop(0, 'rgba(180,10,40,0.06)');
  g2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g2;
  ctx.fillRect(0, 0, W, H);

  // Ghost heart outline
  drawHeartOutline(0.06 + 0.04 * Math.sin(t * 1.8));

  // Orbiting sparkles
  for (const sp of sparkles) {
    sp.orbitOffset += sp.orbitSpeed;
    const basePt = heartPoint(sp.t);
    const orbitR = sp.orbitR * (SCALE / 22);
    const sx = CX + basePt.x + Math.cos(sp.orbitOffset) * orbitR;
    const sy = CY + basePt.y + Math.sin(sp.orbitOffset) * orbitR;
    const twinkle = 0.25 + 0.75 * Math.abs(Math.sin(t * 2.5 + sp.twinklePhase));
    ctx.save();
    ctx.globalAlpha = sp.alpha * twinkle;
    ctx.fillStyle = `hsl(${sp.hue + Math.sin(t + sp.orbitOffset) * 15}, 90%, 68%)`;
    ctx.shadowColor = `hsl(${sp.hue},90%,70%)`;
    ctx.shadowBlur = 6;
    ctx.beginPath();
    ctx.arc(sx, sy, sp.r * twinkle * (SCALE / 22), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Main text
  const fs = FONT_SIZE_BASE();
  ctx.font = `bold ${fs}px Georgia, serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  const copies = chars.length / UNIT.length;
  for (let i = 0; i < chars.length; i++) {
    const { ch, d } = chars[i];
    const dist = ((d + offset) % pathLength + pathLength) % pathLength;
    const pt = getPt(dist);
    const progress = dist / pathLength;
    const shimmer = Math.sin(progress * Math.PI * 2 * copies + t * 2.8);
    const r = Math.floor(215 + 35 * shimmer);
    const g = Math.floor(12 + 22 * Math.abs(shimmer));
    const b = Math.floor(28 + 18 * Math.abs(shimmer));

    ctx.save();
    ctx.translate(CX + pt.x, CY + pt.y);
    ctx.rotate(pt.angle);
    ctx.shadowColor = `rgba(255,50,70,${0.08 + 0.12 * Math.abs(shimmer)})`;
    ctx.shadowBlur = 10;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.globalAlpha = 0.8 + 0.2 * Math.abs(shimmer);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }

  // Mouse mini hearts
  for (let i = miniHearts.length - 1; i >= 0; i--) {
    const h = miniHearts[i];
    h.x += h.vx; h.y += h.vy; h.vy *= 0.996;
    h.life -= h.decay;
    if (h.life <= 0) { miniHearts.splice(i, 1); continue; }
    drawMiniHeart(h.x, h.y, h.size * (0.4 + h.life * 0.6), h.life * 0.48, h.hue);
  }

  // Cursor
  if (mouse.x > 0) {
    ctx.save();
    ctx.globalAlpha = 0.8;
    const cg = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 8);
    cg.addColorStop(0, 'rgba(255,100,120,0.9)');
    cg.addColorStop(1, 'rgba(255,50,80,0)');
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  offset += 0.28;
  requestAnimationFrame(draw);
}

window.addEventListener('resize', () => { resize(); initParticles(); initSparkles(); });
resize();
initParticles();
initSparkles();
draw();
</script>
</body>
</html>
