<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; background: #0a0a0a; display: flex; align-items: center; justify-content: center; min-height: 600px; cursor: none; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 680;
canvas.height = 640;

const CX = 340, CY = 310;
const FONT_SIZE = 15;
const SPEED = 0.3;

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
  return { x: x * 20, y: y * 20 };
}

const NUM_STEPS = 4000;
const heartPath = [];
const dists = [0];
let pathLength = 0;

for (let i = 0; i < NUM_STEPS; i++) {
  const t = (i / NUM_STEPS) * Math.PI * 2;
  heartPath.push(heartPoint(t));
  if (i > 0) {
    const a = heartPath[i-1], b = heartPath[i];
    pathLength += Math.sqrt((b.x-a.x)**2 + (b.y-a.y)**2);
  }
  dists.push(pathLength);
}

function getPt(d) {
  d = ((d % pathLength) + pathLength) % pathLength;
  let lo = 0, hi = NUM_STEPS - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    dists[mid] <= d ? lo = mid : hi = mid;
  }
  const frac = (dists[lo+1] - dists[lo]) === 0 ? 0 : (d - dists[lo]) / (dists[lo+1] - dists[lo]);
  const p0 = heartPath[lo], p1 = heartPath[(lo+1) % NUM_STEPS];
  return {
    x: p0.x + (p1.x - p0.x) * frac,
    y: p0.y + (p1.y - p0.y) * frac,
    angle: Math.atan2(p1.y - p0.y, p1.x - p0.x)
  };
}

ctx.font = `bold ${FONT_SIZE}px Georgia, serif`;
const UNIT = 'I love you ';
const unitW = ctx.measureText(UNIT).width;
const copies = Math.floor(pathLength / unitW);
const adjusted = pathLength / copies;
const scale = adjusted / unitW;

const chars = [];
let pos = 0;
const baseUnit = UNIT.repeat(copies + 1);
for (let i = 0; i < baseUnit.length; i++) {
  const ch = baseUnit[i];
  const w = ctx.measureText(ch).width * scale;
  if (pos >= pathLength) break;
  chars.push({ ch, d: pos, w });
  pos += w;
}

let offset = 0;
const miniHearts = [];
let mouse = { x: -999, y: -999 };
let lastSpawn = 0;

canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - rect.left) * (canvas.width / rect.width);
  mouse.y = (e.clientY - rect.top) * (canvas.height / rect.height);
  const now = Date.now();
  if (now - lastSpawn > 60) {
    lastSpawn = now;
    miniHearts.push({
      x: mouse.x + (Math.random() - 0.5) * 8,
      y: mouse.y + (Math.random() - 0.5) * 8,
      size: Math.random() * 6 + 5,
      alpha: 0.45,
      vy: -(Math.random() * 0.5 + 0.2),
      vx: (Math.random() - 0.5) * 0.4,
      life: 1.0,
      decay: Math.random() * 0.012 + 0.008
    });
  }
});

function drawMiniHeart(x, y, size, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgb(210,40,60)';
  ctx.beginPath();
  const s = size * 0.5;
  ctx.moveTo(x, y + s * 0.5);
  ctx.bezierCurveTo(x, y - s*0.3, x - s, y - s*0.3, x - s, y + s*0.2);
  ctx.bezierCurveTo(x - s, y + s*0.8, x, y + s*1.3, x, y + s*1.3);
  ctx.bezierCurveTo(x, y + s*1.3, x + s, y + s*0.8, x + s, y + s*0.2);
  ctx.bezierCurveTo(x + s, y - s*0.3, x, y - s*0.3, x, y + s*0.5);
  ctx.fill();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const glow = ctx.createRadialGradient(CX, CY+20, 10, CX, CY+20, 280);
  glow.addColorStop(0, 'rgba(220,30,50,0.18)');
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = `bold ${FONT_SIZE}px Georgia, serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';

  for (let i = 0; i < chars.length; i++) {
    const { ch, d } = chars[i];
    const dist = ((d + offset) % pathLength + pathLength) % pathLength;
    const pt = getPt(dist);

    ctx.save();
    ctx.translate(CX + pt.x, CY + pt.y);
    ctx.rotate(pt.angle);
    const progress = dist / pathLength;
    const r = Math.floor(190 + 55 * Math.sin(progress * Math.PI * 2));
    ctx.fillStyle = `rgb(${r},20,30)`;
    ctx.globalAlpha = 0.85 + 0.15 * Math.sin(progress * Math.PI * 4);
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }

  for (let i = miniHearts.length - 1; i >= 0; i--) {
    const h = miniHearts[i];
    h.x += h.vx;
    h.y += h.vy;
    h.life -= h.decay;
    h.alpha = Math.min(0.55, h.life * 0.55);
    if (h.life <= 0) { miniHearts.splice(i, 1); continue; }
    drawMiniHeart(h.x, h.y, h.size * h.life * 0.6 + h.size * 0.4, h.alpha);
  }

  offset += SPEED;
  requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
