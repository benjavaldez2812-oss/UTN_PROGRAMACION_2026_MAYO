<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <input type="checkbox" id="chat-check">

    <div class="kodee--panel">
    <div class="kodee--panel__header">
    <span>Kodee</span>
        <label for="chat-check">&#8964;</label>
    </div>

    <div class="kodee--panel__body">
        <h2>¡Hola! 👋</h2>
        <p>¿En qué te puedo ayudar hoy?</p>

        <div class="kodee--suggestions">
        <a class="kodee--suggestion" href="#">Quiero migrar a Hostinger</a>
        <a class="kodee--suggestion" href="#">Necesito ayuda para elegir el plan</a>
        <a class="kodee--suggestion" href="#">Quiero crear un sitio web</a>
        </div>

        <!-- pastillas -->
        <div class="kodee--tags">
        <span class="kodee--tag active">Productos</span>
        <span class="kodee--tag">n8n</span>
        <span class="kodee--tag">OpenClaw</span>
        <span class="kodee--tag">Horizons</span>
        </div>

        <!-- input -->
        <div class="kodee--input-area">
        <textarea placeholder="Escribí tu pregunta"></textarea>
        <div class="kodee--input-footer">
            <span class="kodee--dot">•</span>
            <button class="kodee--send">↑</button>
        </div>
        </div>

    </div>
    </div>

    <label for="chat-check" class="kodee--button">Preguntarle a Kodee</label>
<p class="kodee--disclaimer">La IA puede producir información inexacta</p>
</body>
</html>
