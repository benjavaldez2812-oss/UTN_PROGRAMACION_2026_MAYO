    <form>
<div>
    <label for="fullname">First Name:</label>
    <input type="text" id="fullname" placeholder="john" minlength="4" max="20" required>
</div>

<div>
     <label for="second_name">Last Name:</label>
     <input type="text" id="second_name" placeholder="Doe">
</div>

<div>
    <label for="email">Email:</label>
    <input type="email" id="email" placeholder="johnDoe@email.com">
</div>

<div>
     <label for="password">Password:</label>
    <input type="password" name="password" pattern="^(?=.*[A-Z]).+$" placeholder="Abc123" title="La contraseña tiene que tene una mayuscula required"/>
</div>

<div>
    <label>Gender:</label><BR>
    <input type="radio" name="Gender"> Male<br>

    <input type="radio" name="Gender"> Other<BR>
</div>

<div>
    <label for="Age">Age:</label>

</div>

<div>
    <labeL for="birth_date">Birthdate</label>
    <input type="date" id="birth_date">
</div>

<div>
    <label>Preferences:</label><br>
    <label>Acrylic Paiting</label>
    <input type="checkbox"><br>
    <label> Oil Paiting</label>
    <input type="checkbox"><br>
    <label>Water Color Paiting</label>
    <input type="checkbox"><br>

</div>

<div>

    <select id="country" name="country">
            <option>argentina</option>
            <option>brasil</option>
            <option disabled>France</option>
            <option>chile</option>

    </select><br>
</div>

<div>
    <br><label for="mensaje">Select Occupation</label>

</div>

<div>
<input type="submit">
 <button type="submit">Registrar</button>

</div>

</div>
